url: http://127.0.0.1:8090
name: web - sell one MSPIKE product for cash and read its bill number (spike)
---
- launchApp
- extendedWaitUntil:
    visible: "ยินดีต้อนรับ"
    timeout: 30000
- tapOn: "ชื่อผู้ใช้"
- inputText: ${USERNAME}
- tapOn: "รหัสผ่าน"
- inputText: ${PASSWORD}
- tapOn: "เข้าสู่ระบบ"
# The cart title is not in the web semantics tree; the total is.
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿0\\.00"
    timeout: 30000
# Wide layout: the grid and its search field are on the selling screen itself.
- tapOn: "ค้นหาชื่อสินค้า หรือสแกนบาร์โค้ด"
- inputText: "MSPIKE"
- tapOn: "MSPIKE product.*"
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿25\\.00"
    timeout: 10000
- tapOn: "ชำระเงิน \\(1 รายการ\\)\n?฿25\\.00"
- tapOn: "รับชำระพอดี ไม่มีเงินทอน"
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿0\\.00"
    timeout: 15000
- tapOn: "รายการขาย"
# Newest bill first; the row's index and date are glued together on the web ("125/11/2026 22:26…").
- tapOn:
    text: "1\\d\\d/\\d\\d/\\d{4} .*"
    index: 0
- extendedWaitUntil:
    visible: "OD_\\d+ .*"
    timeout: 10000
- copyTextFrom: "OD_\\d+ .*"
- evalScript: ${output.bill = maestro.copiedText.split(' ')[0]}
# No "{" "}" inside ${…}: Maestro's ${} parser stops at the first "}" (a regex like [0-9]{12} breaks it).
- assertTrue: ${/^OD_[0-9]+$/.test(output.bill) && output.bill.length == 15}
# The bill's lines are not in the web semantics tree (Android has "1\nMSPIKE product\nCost : …"); the totals are.
- assertVisible: "฿ 25\\.00"
- evalScript: ${console.log('bill=' + output.bill)}
- takeScreenshot: web-bill

# Shared by android-main.yaml and web-main.yaml. The header is required in a subflow file;
# the caller's appId/url is the one used.
appId: app.devper.pos
---
- extendedWaitUntil:
    visible: "ยินดีต้อนรับ"
    timeout: 30000
- tapOn: "ชื่อผู้ใช้"
- inputText: ${USERNAME}
- tapOn: "รหัสผ่าน"
- inputText: ${PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "เข้าสู่ระบบ"
# Web joins merged texts without "\n", Android with it; the web tree also lacks the cart title.
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿0\\.00"
    timeout: 30000
# Layout, not platform: the narrow (phone) layout has the เมนู button and opens the
# product picker from an unlabelled search icon; the wide layout shows the grid inline.
# Wide branch first: once the phone picker is open, เมนู is hidden behind it.
- runFlow:
    when:
      notVisible: "เมนู"
    commands:
      - tapOn: "ค้นหาชื่อสินค้า หรือสแกนบาร์โค้ด"
- runFlow:
    when:
      visible: "เมนู"
    commands:
      - tapOn:
          point: "6%,9%"
      - assertVisible: "เลือกสินค้า"
- inputText: "MSPIKE"
- tapOn: "MSPIKE product.*"
- runFlow:
    when:
      visible: "เลือกสินค้า"
    commands:
      - tapOn: "ปิด"
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿25\\.00"
    timeout: 10000
- assertVisible: "1x"
- assertVisible: "ชำระเงิน \\(1 รายการ\\)\n?฿25\\.00"
- takeScreenshot: cart
- runFlow:
    when:
      visible: "เมนู"
    commands:
      - tapOn: "เมนู"
- tapOn: "ออกจากระบบ"
- extendedWaitUntil:
    visible: "ยินดีต้อนรับ"
    timeout: 15000
- assertVisible: "เข้าสู่ระบบ"

url: http://127.0.0.1:8090
name: web - sign in, add MSPIKE product to cart, sign out (spike)
---
- launchApp
- extendedWaitUntil:
    visible: "ยินดีต้อนรับ"
    timeout: 30000
- tapOn: "ชื่อผู้ใช้"
- inputText: ${USERNAME}
- tapOn: "รหัสผ่าน"
- inputText: ${PASSWORD}
- tapOn: "เข้าสู่ระบบ"
# The cart title is not in the web semantics tree; the total is.
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿0\\.00"
    timeout: 30000
# Wide layout: the grid and its search field are on the selling screen itself.
- tapOn: "ค้นหาชื่อสินค้า หรือสแกนบาร์โค้ด"
- inputText: "MSPIKE"
- tapOn: "MSPIKE product.*"
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿25\\.00"
    timeout: 10000
- takeScreenshot: web-cart
- assertVisible: "1x"
- assertVisible: "ชำระเงิน \\(1 รายการ\\)\n?฿25\\.00"
- tapOn: "ออกจากระบบ"          # sidebar item, always visible in the wide layout
- extendedWaitUntil:
    visible: "ยินดีต้อนรับ"
    timeout: 15000
- assertVisible: "เข้าสู่ระบบ"

appId: app.devper.pos
name: android - sign in, add MSPIKE product to cart, sign out (spike)
---
- launchApp:
    clearState: true
- tapOn: "ชื่อผู้ใช้"          # EditText hintText
- inputText: ${USERNAME}
- tapOn: "รหัสผ่าน"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "เข้าสู่ระบบ"        # Button accessibilityText
# Flutter merges a widget's texts into one node joined by "\n": match with a regex.
- extendedWaitUntil:
    visible: "ตะกร้าสินค้า #1\n.*"
    timeout: 30000
- assertVisible: "ยอดรวมสุทธิ\n฿0\\.00"
# Phone layout: the product grid opens from the search icon, which has no label.
- tapOn:
    point: "6%,9%"
- assertVisible: "เลือกสินค้า"
- inputText: "MSPIKE"          # the search field has focus when the picker opens
- tapOn: "MSPIKE product\n.*"
- tapOn: "ปิด"
- assertVisible: "MSPIKE product\nชิ้น\n฿25\\.00\n.*"
- assertVisible: "1x"
- assertVisible: "ยอดรวมสุทธิ\n฿25\\.00"
- assertVisible: "ชำระเงิน \\(1 รายการ\\)\n฿25\\.00"
- takeScreenshot: android-cart
- tapOn: "เมนู"
- tapOn: "ออกจากระบบ"
- extendedWaitUntil:
    visible: "ยินดีต้อนรับ"
    timeout: 15000
- assertVisible: "เข้าสู่ระบบ"

# The main menu: every item opens its own screen, recognised by something only
# that screen shows, and the way back to selling still works.
appId: app.devper.pos
---
- runFlow:
    file: steps/sign_in.yaml
    env:
      USERNAME: ${MAESTRO_USERNAME}
      PASSWORD: ${MAESTRO_PASSWORD}
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "รายการขาย"
- extendedWaitUntil:
    visible: "สรุปรายการ.*"
    timeout: 15000
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "สินค้า"
- extendedWaitUntil:
    visible: "ค้นหาสิ่งที่คุณต้องการ\\.\\.\\."
    timeout: 15000
# The wide layout shows the add button; the narrow one keeps it in a menu.
- runFlow:
    when:
      true: ${LAYOUT == 'wide'}
    commands:
      - assertVisible: "เพิ่มสินค้า"
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "จัดการ"
- extendedWaitUntil:
    visible: "ร้านค้าของฉัน"
    timeout: 15000
- assertVisible: "จัดการลูกค้า"
- assertVisible: "จัดการผู้ใช้งาน"
- assertVisible: "ใบรับสินค้า"
- assertVisible: "นับสต็อก"
# Android's Back on a page opened from จัดการ returns to จัดการ; it used to
# leave the app. (The web's Back is the browser's, not driven here.)
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "ใบรับสินค้า"
      - extendedWaitUntil:
          visible: "ค้นหาเลขที่ใบรับสินค้า\\.\\.\\."
          timeout: 15000
      - back
      - extendedWaitUntil:
          visible: "ร้านค้าของฉัน"
          timeout: 15000
      - assertVisible: "จัดการลูกค้า"
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "ข้อมูลผู้ใช้งาน"
- extendedWaitUntil:
    visible: "ข้อมูลของฉัน.*"
    timeout: 15000
# The profile is a page of its own, without the menu: leave it by its back button.
- tapOn: "(Back|กลับ|ย้อนกลับ)"
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "ขายสินค้า"
- extendedWaitUntil:
    visible: "ยอดรวมสุทธิ\n?฿0\\.00"
    timeout: 15000
- runFlow: steps/sign_out.yaml

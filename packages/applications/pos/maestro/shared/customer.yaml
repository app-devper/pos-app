# A customer's life: added through the form (with a second one that stays),
# on the server, found by name and chosen for a sale on the selling screen,
# then found by the list's search, deleted from its own page, gone from the
# server and from the list while the second one is listed.
appId: app.devper.pos
env:
  CUSTOMER: MST-${RUN_ID} customer
  KEEPER: MST-${RUN_ID} keeper
---
- runFlow:
    file: steps/sign_in.yaml
    env:
      USERNAME: ${MAESTRO_USERNAME}
      PASSWORD: ${MAESTRO_PASSWORD}
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "จัดการ"
- tapOn: "จัดการลูกค้า"
# The list's title is a header the web now writes into the page.
- extendedWaitUntil:
    visible: "ข้อมูลลูกค้า"
    timeout: 15000
- runFlow:
    file: steps/add_customer.yaml
    env:
      NAME: ${CUSTOMER}
      PHONE: 08${RUN_ID}0
# A second customer that stays: the end of the flow sees it listed, which
# proves the list has loaded when the removed one is not there.
- runFlow:
    file: steps/add_customer.yaml
    env:
      NAME: ${KEEPER}
      PHONE: 08${RUN_ID}1
# The customer page is pushed over จัดการ: its back arrow returns to the menu.
- tapOn: "ย้อนกลับ"
- extendedWaitUntil:
    visible: "จัดการลูกค้า"
    timeout: 15000
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "ขายสินค้า"
- extendedWaitUntil:
    visible: "(ยอดรวมสุทธิ\n?฿0\\.00|ตะกร้าสินค้า #1\n?ว่าง)"
    timeout: 15000
# The phone keeps the cart behind the bar along the foot of the products.
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - tapOn: "ตะกร้าสินค้า #1\n?ว่าง"
- tapOn: "ข้อมูลลูกค้า\n?เลือกลูกค้า"
- tapOn: "ค้นหา\\.\\.\\."
- inputText: MST-${RUN_ID}
- extendedWaitUntil:
    visible: "${CUSTOMER}.*"
    timeout: 15000
- tapOn: "${CUSTOMER}.*"
# The cart shows the chosen customer by name and code (one node of their
# own, on the web too), and names them on the button that takes them off.
- extendedWaitUntil:
    visible: "${CUSTOMER}\n?.+"
    timeout: 10000
- assertVisible: "นำลูกค้า ${CUSTOMER} ออก"
- takeScreenshot: customer-on-sale
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - tapOn: "ปิด"
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "จัดการ"
- tapOn: "จัดการลูกค้า"
# The list is searched rather than scrolled: a real shop has many customers.
- tapOn: "ค้นหาลูกค้า\\.\\.\\."
- inputText: MST-${RUN_ID}
- runFlow: steps/hide_keyboard.yaml
- extendedWaitUntil:
    visible: "${CUSTOMER}.*"
    timeout: 15000
- tapOn: "${CUSTOMER}.*"
- tapOn: "แก้ไข"
- scrollUntilVisible:
    element: "ลบลูกค้า"
    direction: DOWN
    timeout: 20000
- tapOn: "ลบลูกค้า"
- assertVisible: "ต้องการลบลูกค้าใช่หรือไม่\\?"
- tapOn: "ยืนยัน"
- extendedWaitUntil:
    visible: "เพิ่มลูกค้า"
    timeout: 15000
# The server archives the customer a moment after the tap: ask until it has.
- repeat:
    times: 15
    while:
      true: ${output.customerCount != '0'}
    commands:
      - waitForAnimationToEnd:
          timeout: 1000
      - runScript:
          file: ../scripts/api.js
          env:
            ACTION: customerCount
            NAME: ${CUSTOMER}
- assertTrue: ${output.customerCount == '0'}
# Finding 7, fixed: the server keeps the removed customer as ARCHIVED, and the
# list leaves archived customers out, so the row leaves the list. The list
# still holds the search for MST-<run>, and the keeper, found by it, must be
# listed first: only a loaded list makes "not visible" mean something.
- extendedWaitUntil:
    visible: "${KEEPER}.*"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "${CUSTOMER}.*"
    timeout: 15000

# Goods come in: a receipt for the run's supplier, one line of five of the
# run's product (chosen through the product search), imported into stock. The server then holds 1005 on hand.
appId: app.devper.pos
---
- runScript:
    file: ../scripts/api.js
    env:
      ACTION: productOnHand
      NAME: ${PRODUCT_NAME}
- assertTrue: ${output.onHand == '1000'}
- runFlow:
    file: steps/sign_in.yaml
    env:
      USERNAME: ${MAESTRO_USERNAME}
      PASSWORD: ${MAESTRO_PASSWORD}
- runFlow:
    file: steps/open_screen.yaml
    env:
      SCREEN: "จัดการ"
- tapOn: "ใบรับสินค้า / Goods Receipt"
- extendedWaitUntil:
    visible: "ค้นหาเลขที่ใบรับสินค้า\\.\\.\\."
    timeout: 15000
# The narrow layout keeps the add entry in the list's menu.
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - tapOn: "เมนูใบรับสินค้า"
- tapOn: "เพิ่มใบรับสินค้า"
- extendedWaitUntil:
    visible: "สร้างใบรับสินค้า"
    timeout: 15000
- tapOn: "ร้านขายสินค้า"
- runFlow:
    file: steps/choose_dropdown_option.yaml
    env:
      OPTION: MST-${RUN_ID} supplier
- tapOn: "หมายเลขอางอิง"
- inputText: REF-${RUN_ID}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "สร้างใบรับสินค้า"
- extendedWaitUntil:
    visible: "เพิ่มรายการสินค้า"
    timeout: 15000
- takeScreenshot: receipt-created
- tapOn: "เพิ่มรายการสินค้า"
- extendedWaitUntil:
    visible: "เพิ่มรายการรับสินค้า"
    timeout: 10000
# The product is found through the app's product picker and its search; its
# row reads the name, then the unit and the number of lots.
- tapOn: "สินค้า"
- extendedWaitUntil:
    visible: "ค้นหาสินค้า\\.\\.\\."
    timeout: 10000
- tapOn: "ค้นหาสินค้า\\.\\.\\."
- inputText: MST-${RUN_ID}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible: "${PRODUCT_NAME}\n?.*ล็อต"
    timeout: 15000
- tapOn: "${PRODUCT_NAME}\n?.*ล็อต"
- extendedWaitUntil:
    visible: "เพิ่มรายการรับสินค้า"
    timeout: 10000
- tapOn: "จำนวน \\(.*"
- inputText: "5"
- tapOn: "เลขล็อต"
- inputText: LOT${RUN_ID}
- tapOn: "วันหมดอายุ \\(YYYY-MM-DD\\)"
- inputText: "2030-01-31"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "เพิ่มรายการ"
- extendedWaitUntil:
    visible: "Name: ${PRODUCT_NAME}.*"
    timeout: 15000
# The green "Update success" bar lies over the import button on a narrow
# screen until it closes by itself (4 s).
- extendedWaitUntil:
    notVisible: ".*Update success.*"
    timeout: 10000
- tapOn: "นำเข้าสต็อก"
- tapOn: "ยืนยัน"
- extendedWaitUntil:
    visible: "นำเข้าสต็อกแล้ว"
    timeout: 15000
- takeScreenshot: receipt-imported
- runScript:
    file: ../scripts/api.js
    env:
      ACTION: productOnHand
      NAME: ${PRODUCT_NAME}
- assertTrue: ${output.onHand == '1005'}

# Puts two of ${PRODUCT_NAME} in the cart. On the narrow layout the product
# grid is a dialog behind the search button; on the wide one it is on the
# selling screen. The search text is only the run's prefix, so the field's own
# value never matches the tile's selector.
appId: app.devper.pos
---
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - tapOn: "เลือกสินค้า"
- runFlow:
    when:
      true: ${LAYOUT == 'wide'}
    commands:
      - tapOn: "ค้นหาชื่อสินค้า หรือสแกนบาร์โค้ด"
- inputText: MST-${RUN_ID}
- extendedWaitUntil:
    visible: "${PRODUCT_NAME}.*"
    timeout: 15000
- tapOn: "${PRODUCT_NAME}.*"
- tapOn: "${PRODUCT_NAME}.*"
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - tapOn: "ปิด"

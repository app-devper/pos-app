# Puts two of ${PRODUCT_NAME} in the cart, and shows the cart: on the narrow
# layout the products come first and the cart opens from the bar along the
# foot; on the wide one it is beside them. The search text is only the run's
# prefix, so the field's own value never matches the card's selector.
appId: app.devper.pos
---
- tapOn: "ค้นหาชื่อสินค้า หรือสแกนบาร์โค้ด"
- inputText: MST-${RUN_ID}
- extendedWaitUntil:
    visible: "${PRODUCT_NAME}.*"
    timeout: 15000
- tapOn: "${PRODUCT_NAME}.*"
- tapOn: "${PRODUCT_NAME}.*"
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - runFlow: hide_keyboard.yaml
      - tapOn: "ตะกร้าสินค้า #\\d+\n?\\d+ รายการ.*"

# Chooses ${OPTION} in the dropdown that was just opened.
#
# On Android the open menu's options are ordinary text nodes. On the web the
# open menu exposes no option text at all, so the option cannot be addressed:
# the flows' database holds exactly one supplier and one product (the run's),
# the menu opens with it focused, and Enter chooses it. What was chosen is
# asserted afterwards by the caller, on the page.
appId: app.devper.pos
---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: ${OPTION}
- runFlow:
    when:
      platform: Web
    commands:
      - pressKey: Enter

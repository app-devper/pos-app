# On the bills list of a manager or a user: the menu holds selling and bills
# only, and the bills show no cost, on a row or in the foot. The list is waited
# for first (its foot), and its animations to end: the role reaches the
# screen with the list, so what the role hides is checked once it is there.
appId: app.devper.pos
---
- extendedWaitUntil:
    visible: "สรุปรายการ.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "ยอดรวม ฿ .*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "ต้นทุน ฿ .*"
- assertNotVisible: ".*ต้นทุน: .*"
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - tapOn: "เมนู"
- assertVisible: "ขายสินค้า"
- assertVisible: "รายการขาย"
- assertNotVisible: "สินค้า"
- assertNotVisible: "จัดการ"
- runFlow:
    when:
      true: ${LAYOUT == 'narrow'}
    commands:
      - tapOn: "รายการขาย"

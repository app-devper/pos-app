# On a product's สต็อก tab: the lot L${RUN_ID}'s adjust button, then reason
# อื่นๆ, ${DIRECTION} (เพิ่มสต็อก or ลดสต็อก), ${QUANTITY} and the note
# ${NOTE}, confirmed. Returns once the dialog is gone.
appId: app.devper.pos
---
- tapOn: "ปรับสต็อก ล็อต L${RUN_ID}"
- extendedWaitUntil:
    visible: "ปรับสต็อกสินค้า"
    timeout: 10000
- assertVisible: "ล็อต L${RUN_ID} คงเหลือ ${ON_HAND}"
- tapOn: "เหตุผลการปรับสต็อก"
- runFlow:
    file: choose_dropdown_option.yaml
    env:
      OPTION: "อื่นๆ"
# The add / take toggle by its identifier, its text: the web writes a
# toggle's name only as an aria-label.
- tapOn:
    id: ${DIRECTION}
- tapOn: "จำนวน"
- inputText: ${QUANTITY}
- tapOn: "หมายเหตุ"
- inputText: ${NOTE}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "ยืนยัน"
- extendedWaitUntil:
    notVisible: "ปรับสต็อกสินค้า"
    timeout: 15000

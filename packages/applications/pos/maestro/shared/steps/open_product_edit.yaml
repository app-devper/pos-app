# From anywhere in the shell: สินค้า, ${NAME}'s detail, then its แก้ไข form,
# scrolled to its red ลบสินค้า and pressed; ends on the question it asks.
appId: app.devper.pos
---
- runFlow:
    file: open_screen.yaml
    env:
      SCREEN: "สินค้า"
- extendedWaitUntil:
    visible: "${NAME}.*"
    timeout: 15000
- tapOn: "${NAME}.*"
- extendedWaitUntil:
    visible: "แก้ไข"
    timeout: 15000
- tapOn: "แก้ไข"
- extendedWaitUntil:
    visible: "ชื่อสินค้า.*"
    timeout: 15000
- scrollUntilVisible:
    element: "ลบสินค้า"
    direction: DOWN
    timeout: 15000
- tapOn: "ลบสินค้า"

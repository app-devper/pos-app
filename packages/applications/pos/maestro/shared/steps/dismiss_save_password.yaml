# Android's autofill service (Google's "Save password to Google?" sheet) may
# offer to save what the sign-in form typed, and its sheet covers the app.
# When it shows, it is answered "Not now": that choice saves nothing and
# changes no setting (the sheet may ask again next time). It is a no-op when
# the sheet is not there, and on the web.
appId: app.devper.pos
---
- runFlow:
    when:
      platform: Android
      visible:
        id: "android:id/autofill_save_no"
        text: "Not now"
    commands:
      - tapOn:
          id: "android:id/autofill_save_no"
          text: "Not now"
